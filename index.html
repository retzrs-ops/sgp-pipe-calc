<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメントした人</title>
<style>
  :root{
    --bg:#1e2028; --panel:#272a34; --line:#353946; --text:#e8e9ee; --sub:#9aa0ae;
    --accent:#5ec2a0; --first:#ffb454; --done:#5c6170;
    --size:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Meiryo","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:var(--size)}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  #count{font-weight:700;font-size:1.05em}
  #sub{color:var(--sub);font-size:.85em}
  .sp{flex:1}
  button{font:inherit;font-size:.85em;color:var(--text);background:#3a3e4c;border:0;border-radius:6px;padding:5px 9px;cursor:pointer}
  button:hover{background:#464b5c}
  button:disabled{opacity:.35;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button[aria-pressed="true"]{background:var(--accent);color:#10231c}
  #list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
  .row{display:grid;grid-template-columns:2.4em 1.9em 1fr auto;align-items:center;gap:8px;
    padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .row:hover{background:#252832}
  .num{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
  .icon{width:1.9em;height:1.9em;border-radius:50%;background:#333;object-fit:cover}
  .who{min-width:0}
  .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .orig{color:var(--sub);font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{text-align:right;color:var(--sub);font-size:.8em;line-height:1.3;white-space:nowrap}
  .badge{display:inline-block;font-size:.75em;font-weight:700;color:#2b1a00;background:var(--first);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .row.done .name,.row.done .num{color:var(--done)}
  .row.done .icon{opacity:.4}
  .row.done .name::before{content:"✓ ";color:var(--accent)}
  .row.is-new{animation:flash 2.5s ease-out}
  @keyframes flash{from{background:#3d4a43}to{background:transparent}}
  @media (prefers-reduced-motion: reduce){.row.is-new{animation:none}}
  body.hide-done .row.done{display:none}
  .sizes{display:flex;gap:2px}
  .sizes button{min-width:2.2em;padding:5px 6px}
  #sizeVal{color:var(--sub);font-size:.8em;min-width:2.6em;text-align:center;align-self:center}
  #empty{color:var(--sub);padding:24px 14px;line-height:1.7}
  #err{background:#6b2b2b;padding:8px 10px;font-size:.9em}
  #err:empty{display:none}
</style>
</head>
<body>
<header>
  <span id="count">0人</span><span id="sub"></span>
  <span class="sp"></span>
  <span class="sizes"><button id="smaller" title="文字を小さく" aria-label="文字を小さく">A−</button><span id="sizeVal"></span><button id="bigger" title="文字を大きく" aria-label="文字を大きく">A＋</button></span>
  <button id="hideDone" aria-pressed="false" title="挨拶済みの人を隠す">済を隠す</button>
  <button id="reset" title="今回のリストを消す">リセット</button>
</header>
<div id="err"></div>
<ul id="list"></ul>
<div id="empty">まだコメントはありません。<br>名前をクリックすると「挨拶済み」にできます。</div>

<script src="config.js"></script>
<script src="http://localhost:11180/templates/preset/__origin/js/onesdk.js"></script>
<script>
(() => {
  const C = Object.assign({ includeOwner:false, autoResetHours:4, resetOnClear:true, nicknames:{} }, window.CLIST_CONFIG || {});
  const KEY = "clist:dock:v1";
  const $ = id => document.getElementById(id);
  const listEl = $("list");

  let s = load();
  function blank(){ return { users:{}, order:[], seen:{}, lastAt:0, hideDone:false }; }
  function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.users) return Object.assign(blank(), v); } catch(e){} return blank(); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
  function reset(){ const h = s.hideDone; s = blank(); s.hideDone = h; save(); render(); }

  function nameOf(d){
    const n = C.nicknames || {};
    for (const k of [d.screenName, d.screenName && "@"+String(d.screenName).replace(/^@/,""), d.name, d.displayName])
      if (k && n[k]) return n[k];
    return d.nickname || d.displayName || d.name || "名無しさん";
  }
  const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

  function handle(comments){
    if (!Array.isArray(comments)) return;
    const list = comments.slice().sort((a,b)=> new Date(a.data?.timestamp||0) - new Date(b.data?.timestamp||0));
    const fresh = []; let changed = false;
    for (const c of list){
      const d = c && c.data; if (!d) continue;
      if (d.meta && d.meta.type === "system") continue;
      if (d.isOwner && !C.includeOwner) continue;
      const cid = d.id || c.id; if (cid && s.seen[cid]) continue; if (cid) s.seen[cid] = 1;
      const t = new Date(d.timestamp || Date.now()).getTime();
      if (C.autoResetHours > 0 && s.lastAt && t - s.lastAt > C.autoResetHours*3600e3){
        const h = s.hideDone; s = blank(); s.hideDone = h; if (cid) s.seen[cid] = 1;
      }
      const id = (c.service||"") + ":" + (d.userId || d.name);
      const name = nameOf(d);
      let u = s.users[id];
      if (!u){
        // 初見判定：わんコメの累計コメント数（meta.tc）が1以下＝これまで一度もコメントしていない人
        // （isFirstTime は「この配信で初めてのコメント」なので全員に付いてしまうため使わない）
        const tc = c.meta && typeof c.meta.tc === "number" ? c.meta.tc : null;
        u = s.users[id] = { name, orig:d.name||"", icon:d.profileImage||"", firstAt:t, lastAt:t, count:0, firstTime: tc !== null && tc <= 1, done:false };
        s.order.push(id); fresh.push(id);
      }
      u.name = name; u.orig = d.name || u.orig; if (d.profileImage) u.icon = d.profileImage;
      u.count++; u.lastAt = t; changed = true;
      if (t > s.lastAt) s.lastAt = t;
    }
    const ks = Object.keys(s.seen); if (ks.length > 8000) ks.slice(0, ks.length-5000).forEach(k => delete s.seen[k]);
    if (changed){ save(); render(fresh); }
  }

  function render(fresh = []){
    const atBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 30;
    listEl.textContent = "";
    let done = 0;
    s.order.forEach((id, i) => {
      const u = s.users[id]; if (!u) return; if (u.done) done++;
      const li = document.createElement("li");
      li.className = "row" + (u.done ? " done" : "") + (fresh.includes(id) ? " is-new" : "");
      li.title = "クリックで挨拶済みにする／戻す";
      li.innerHTML = '<span class="num"></span><img class="icon" alt="" referrerpolicy="no-referrer"><div class="who"><div class="name"></div><div class="orig"></div></div><div class="meta"></div>';
      li.querySelector(".num").textContent = i + 1;
      const img = li.querySelector(".icon"); if (u.icon) img.src = u.icon; else img.style.visibility = "hidden";
      const nm = li.querySelector(".name"); nm.textContent = u.name;
      if (u.firstTime){ const b = document.createElement("span"); b.className = "badge"; b.textContent = "初見"; nm.appendChild(b); }
      li.querySelector(".orig").textContent = u.orig && u.orig !== u.name ? u.orig : "";
      li.querySelector(".meta").innerHTML = hhmm(u.firstAt) + "<br>" + u.count + "コメ";
      li.onclick = () => { u.done = !u.done; save(); render(); };
      listEl.appendChild(li);
    });
    $("count").textContent = s.order.length + "人";
    $("sub").textContent = s.order.length ? "（挨拶済 " + done + "）" : "";
    $("empty").style.display = s.order.length ? "none" : "";
    document.body.classList.toggle("hide-done", s.hideDone);
    $("hideDone").setAttribute("aria-pressed", String(s.hideDone));
    if (fresh.length && atBottom) listEl.scrollTop = listEl.scrollHeight; // 一番下を見ているときは新しい人に追従
  }

  $("hideDone").onclick = () => { s.hideDone = !s.hideDone; save(); render(); };
  $("reset").onclick = () => { if (confirm("今回のリストを消して最初からにしますか？")) reset(); };

  // ---- 文字サイズ（10〜32px、この端末に保存） ----
  const SIZE_KEY = "clist:dock:size";
  let size = 12;
  try { const v = parseInt(localStorage.getItem(SIZE_KEY), 10); if (v >= 10 && v <= 32) size = v; } catch(e){}
  function applySize(){
    document.documentElement.style.setProperty("--size", size + "px");
    $("sizeVal").textContent = size + "px";
    $("smaller").disabled = size <= 10; $("bigger").disabled = size >= 32;
    try { localStorage.setItem(SIZE_KEY, String(size)); } catch(e){}
  }
  $("smaller").onclick = () => { size = Math.max(10, size - 1); applySize(); };
  $("bigger").onclick  = () => { size = Math.min(32, size + 1); applySize(); };
  applySize();

  render();

  if (!window.OneSDK){ $("err").textContent = "わんコメに接続できません。わんコメを起動してから、このページを再読み込みしてください。"; return; }
  OneSDK.setup({ permissions: ["comments", "clear"], mode: "all", commentLimit: 1000 });
  OneSDK.subscribe({ action: "comments", callback: handle });
  OneSDK.subscribe({ action: "clear", callback: () => { if (C.resetOnClear) reset(); } });
  OneSDK.connect();
})();
</script>
</body>
</html>
