<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SGP 切断長計算</title>
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#1E2830; --sub:#5E6B75; --line:#C9D1D7;
  --steel:#4A5A66; --mark:#F2B705; --mark-ink:#1E2830; --warn:#B3261E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-mode="thread"],body[data-mode="isoT"]{--steel:#2E7D6B}
:root{--grid:#D3DAE0;--pipe:#1E2830;--blue:#1565C0;--red:#C62828}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161C21; --surface:#212A31; --ink:#E6EBEF; --sub:#9AA7B1; --line:#36424B;
    --steel:#8FA3B2; --mark:#F2B705; --mark-ink:#161C21; --warn:#F28B82; color-scheme:dark;}
  :root:not([data-theme="light"]) body[data-mode="thread"],:root:not([data-theme="light"]) body[data-mode="isoT"]{--steel:#6CC3AE}
  :root:not([data-theme="light"]){--grid:#2E3941;--pipe:#E6EBEF;--blue:#82B6F5;--red:#FF8A80}
}
:root[data-theme="dark"]{--bg:#161C21; --surface:#212A31; --ink:#E6EBEF; --sub:#9AA7B1; --line:#36424B;
  --steel:#8FA3B2; --mark:#F2B705; --mark-ink:#161C21; --warn:#F28B82; color-scheme:dark;}
:root[data-theme="dark"] body[data-mode="thread"],:root[data-theme="dark"] body[data-mode="isoT"]{--steel:#6CC3AE}
:root[data-theme="dark"]{--grid:#2E3941;--pipe:#E6EBEF;--blue:#82B6F5;--red:#FF8A80}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 120px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--steel);border-radius:8px;overflow:hidden;margin-bottom:12px}
.modes button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;padding:12px 6px;cursor:pointer;line-height:1.3}
.modes button small{display:block;font-weight:400;font-size:.75rem;color:var(--sub)}
.modes button[aria-pressed="true"]{background:var(--steel);color:var(--surface)}
.modes button[aria-pressed="true"] small{color:var(--surface);opacity:.85}
header h1{font-size:1.35rem;margin:4px 0 2px;letter-spacing:.02em}
header p{margin:0 0 14px;color:var(--sub);font-size:.9rem}
.seg{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--steel);
  border-radius:6px;padding:12px;margin-bottom:12px}
.seg-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.seg-no{font-weight:700;color:var(--steel);font-size:1.05rem}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.toggle button{border:0;background:transparent;color:var(--ink);padding:6px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--steel);color:var(--surface);font-weight:700}
.del{border:0;background:transparent;color:var(--sub);font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:.8rem;color:var(--sub);margin-bottom:2px}
select,input{width:100%;font:inherit;font-size:1.05rem;padding:9px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink)}
input{text-align:right}
:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
.result{margin-top:12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cut{background:var(--mark);color:var(--mark-ink);font-weight:800;font-size:1.9rem;padding:2px 12px;border-radius:4px;line-height:1.3}
.cut small{font-size:.9rem;font-weight:700;margin-left:2px}
.formula{color:var(--sub);font-size:.85rem;overflow-wrap:anywhere}
.err{color:var(--warn);font-size:.9rem;font-weight:700}
.add{width:100%;padding:14px;font:inherit;font-weight:700;font-size:1rem;border:2px dashed var(--steel);
  background:transparent;color:var(--steel);border-radius:6px;cursor:pointer}
.sumbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.total-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sumbar b{font-size:1.25rem}
.sumbar button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--sub);padding:6px 10px;border-radius:6px;cursor:pointer}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:18px 0 0;padding:10px 12px}
summary{font-weight:700;cursor:pointer}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
th,td{border:1px solid var(--line);padding:4px;text-align:center}
th{background:var(--bg);font-weight:600}
td input{padding:5px 6px;font-size:.9rem;min-width:64px}
.note{color:var(--sub);font-size:.82rem;margin:8px 0 0}
.gaprow{display:flex;align-items:center;gap:10px;margin-top:12px}
.gaprow input{max-width:110px}
.kp-pad{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--steel);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .15s ease-out}
body.kp-open .kp-pad{transform:none}
body.kp-open .wrap{padding-bottom:340px}
.kp-top{max-width:480px;margin:0 auto 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--sub)}
.kp-top button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;border-radius:6px;cursor:pointer}
.kp-keys{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:56px;gap:6px}
.kp-keys button{font:inherit;font-size:1.45rem;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.kp-keys button:active{background:var(--line)}
.kp-keys .fn{font-size:1.05rem;background:var(--surface);color:var(--steel)}
.kp-keys .next{grid-row:span 2;background:var(--steel);color:var(--surface);font-size:1.05rem;border-color:var(--steel)}
input.kp-active{outline:3px solid var(--mark);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.kp-pad{transition:none}}
body[data-mode^="iso"] #segs,body[data-mode^="iso"] #add,body[data-mode^="iso"] .sumbar{display:none}
body:not([data-mode^="iso"]) #iso{display:none}
body[data-mode^="iso"] .wrap{padding-bottom:40px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.tools.sub{display:flex;flex-wrap:wrap}
.tools button{font:inherit;font-size:.85rem;font-weight:700;padding:8px 2px;line-height:1.25;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--steel);color:var(--surface);border-color:var(--steel)}
.tools.sub button{font-size:.88rem;font-weight:600;padding:6px 10px;border-radius:999px}
.hint{color:var(--sub);font-size:.82rem;margin:0 0 6px;min-height:2.6em}
#isoBox{position:relative;height:53vh;min-height:290px;max-height:646px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#isoSvg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;font:inherit;font-size:1.2rem;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;opacity:.92}
.iso-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.iso-actions select{width:auto;padding:7px 8px;font-size:.95rem}
.iso-actions button{font:inherit;font-size:.92rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.iso-actions .primary{margin-left:auto;background:var(--red);color:#fff;border-color:var(--red);font-weight:800}
.gridline{stroke:var(--grid);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
.pipe{stroke:var(--pipe);stroke-width:4;stroke-linecap:round}
.selpipe{stroke:var(--mark);stroke-width:14;stroke-linecap:round;opacity:.6}
.m-elb{fill:var(--pipe)}
.m-tee{fill:var(--mark);stroke:var(--pipe);stroke-width:1.5}
.m-open{fill:var(--surface);stroke:var(--pipe);stroke-width:1.5}
.m-fl{stroke:var(--pipe);stroke-width:2.5;stroke-linecap:round}
.m-part{fill:var(--surface);stroke:var(--pipe);stroke-width:1.6;stroke-linejoin:round}
.m-zig{fill:none;stroke:var(--pipe);stroke-width:1.3}
.m-stub{stroke:var(--pipe);stroke-width:3;stroke-dasharray:3 3}
.m-sel{fill:var(--mark);opacity:.5}
.m-err{fill:none;stroke:var(--red);stroke-width:2}
.lbl{font-size:12px;font-weight:800;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;font-family:inherit}
.lbl.blue{fill:var(--blue)}.lbl.red{fill:var(--red)}
.lbl.muted{fill:var(--sub);font-weight:500;font-size:10px}
.lbl.sz{fill:var(--sub);font-weight:600;font-size:9.5px}
.lbl.sm{fill:var(--ink);font-size:9.5px;font-weight:700}
.lbl.warn{fill:var(--red)}
#isoSum{margin-top:10px}
.legend{font-size:.85rem;margin:0 0 6px}.c-blue{color:var(--blue);font-weight:800}.c-red{color:var(--red);font-weight:800}
.sumtbl{min-width:0;background:var(--surface)}
.kp-extra{max-width:480px;margin:0 auto 6px}
#isoInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
.iso-rows{display:flex;flex-direction:column;gap:3px;max-height:36vh;overflow-y:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font:inherit;font-size:.88rem;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:left;cursor:pointer}
.row b{font-size:1.15rem;font-weight:800}
.row.auto{background:transparent;border-style:dotted;cursor:default;padding:3px 10px}
.row.auto span{flex:1}.row.auto b{font-size:1rem}.row.auto em{font-style:normal;font-size:.85rem;min-width:6.5em;text-align:right}
.parthead{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;margin:2px 0 0 4px}
.conn{display:inline-flex}
.conn button{font:inherit;font-size:.8rem;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.conn button:first-child{border-radius:6px 0 0 6px}.conn button:last-child{border-radius:0 6px 6px 0;border-left:0}
.conn button.on{background:var(--steel);color:var(--surface);border-color:var(--steel)}
.m-thr{stroke:var(--pipe);stroke-width:1.2}
.m-pack{fill:var(--mark);stroke:var(--pipe);stroke-width:.8}
.ptools{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chk{font:inherit;font-size:13px;font-weight:700;padding:1px 8px;min-height:22px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chk.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.row.auto .chk{margin-right:6px}
.row.total{border-left:5px solid var(--blue)}.row.total b{color:var(--blue)}
.row.pos{border-left:5px dashed var(--blue);margin-left:10px}.row.pos b{color:var(--blue)}
.row.len{margin-left:10px}
.row.on{box-shadow:0 0 0 3px var(--mark) inset}
.chipcap{flex:0 0 auto;align-self:center;font-size:.8rem;color:var(--sub)}
.iso-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.iso-calc{font-size:.8rem;color:var(--sub)}
.flip{flex:0 0 auto;font:inherit;font-size:.8rem;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.dimline{stroke:var(--blue);stroke-width:1.2}
.dimline.dash{stroke-dasharray:5 3}
.dimline.total{stroke-width:1.8}
.dimext{stroke:var(--blue);stroke-width:.8;opacity:.55}
.dimbase{fill:var(--blue)}
.dimarrow{fill:var(--blue)}
.leader{stroke:var(--sub);stroke-width:.7;fill:none}
.lbl .blue{fill:var(--blue)}.lbl .red{fill:var(--red)}.lbl .muted{fill:var(--sub);font-weight:500;font-size:10px}
.lbl .sz{fill:var(--sub);font-weight:600;font-size:9.5px}.lbl .sm{fill:var(--ink);font-size:9.5px;font-weight:700}.lbl .warn{fill:var(--red)}
.lbl .dimcap{fill:var(--blue);font-size:9px;font-weight:600}
.lbl .total{font-size:13px}
.lbl .szb{fill:var(--ink);font-size:11px;font-weight:800}
.lbl .cutcap{fill:var(--red);font-size:9px;font-weight:600}
.lbl .sep{fill:var(--sub);font-weight:500;font-size:10px}
.leaddot{fill:var(--sub)}
.lgbox{position:absolute;left:8px;top:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700;opacity:.95;pointer-events:none}
.lgbox .lk{color:var(--ink)}.lgbox .lsep{color:var(--sub);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.chips button{flex:0 0 auto;font:inherit;font-size:.95rem;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--steel);color:var(--surface);border-color:var(--steel);font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:30;transition:all .2s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mini{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;margin-top:10px}
/* ===== 表示サイズの固定（端末の文字サイズ設定やズームに左右されない） ===== */
body{font-size:16px}
select,input,td input{font-size:16px!important}
td input{min-width:70px}
label{font-size:13px}
.modes button{font-size:16px;min-height:52px}.modes button small{font-size:12px}
.tools button{font-size:14px;min-height:44px}
.tools.sub button{font-size:14px;min-height:36px}
.hint{font-size:13px}
.iso-actions button,.iso-actions select{font-size:15px;min-height:40px}
.kp-pad{display:flex;flex-direction:column;max-height:calc(100vh - 8px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 8px);padding-top:4px}
.kp-top{flex:0 0 auto;width:100%;max-width:420px;font-size:14px;margin-bottom:4px}
.kp-top button{font-size:14px;min-height:32px}
.kp-extra{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%;max-width:420px}
.iso-rows{flex:1 1 auto;min-height:0;max-height:40vh}
.kp-keys{flex:0 0 auto;width:100%;max-width:420px;grid-auto-rows:44px;gap:5px}
.kp-keys button{font-size:20px;border-radius:7px}
.kp-keys .fn,.kp-keys .next{font-size:15px}
.row{font-size:14px;min-height:36px}
.row b{font-size:17px}
.row.auto{min-height:30px}.row.auto b{font-size:15px}.row.auto em{font-size:13px}
.row.total{position:sticky;top:0;z-index:1;background:var(--surface);min-height:40px}
.row.total b{font-size:19px}
.parthead{font-size:13px}
.conn button{font-size:13px;min-height:28px}
.chips{flex:0 0 auto}.chips button{font-size:14px;min-height:32px}
.iso-foot{flex:0 0 auto}.iso-calc,.flip{font-size:13px}
.cut{font-size:28px}.formula{font-size:13px}
.sumbar b{font-size:20px}
body.kp-open .wrap{padding-bottom:320px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sharetop{font:inherit;font-size:14px;min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:14px 14px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-in h3{margin:0 0 10px;font-size:17px}
.sbtn{display:block;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:700;min-height:52px;padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.sbtn small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.sbtn.close{text-align:center;background:transparent}
#linkBox textarea{width:100%;font-size:13px!important;font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px}
.lrow{display:flex;gap:8px;margin:6px 0}
.lrow button,.linebtn{flex:1;display:flex;align-items:center;justify-content:center;font:inherit;font-size:15px;font-weight:700;min-height:44px;border-radius:8px;cursor:pointer;text-decoration:none}
.lrow button{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.linebtn{background:#06C755;color:#fff;border:0}
#preview img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.dump{width:100%;height:120px;font-size:12px!important}
/* ===== ボタンの高さ（20%低く） ===== */
.modes button{min-height:42px;padding:6px 4px}
.tools button{min-height:35px;padding:5px 2px}
.tools.sub button{min-height:29px;padding:3px 10px}
.iso-actions button,.iso-actions select{min-height:32px;padding:4px 12px}
.kp-keys{grid-auto-rows:35px}
.kp-top button{min-height:26px;padding:2px 12px}
.row{min-height:29px;padding:3px 10px}.row.total{min-height:32px}.row.auto{min-height:24px}
.conn button{min-height:22px;padding:1px 10px}
.chips button{min-height:26px;padding:3px 10px}
.sharetop{min-height:29px;padding:2px 12px}
.sbtn{min-height:42px;padding:7px 12px}
.lrow button,.linebtn{min-height:35px}
.mini{padding:4px 10px}
select,input{padding:6px 10px}
div.sumbar button{padding:4px 10px}
.add{padding:10px}
/* 図の右側の操作列 */
.zoom{width:58px;align-items:stretch}
.zoom button{width:58px;height:32px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.zoom .zw{height:38px}
.zoom button:disabled{opacity:.35}
.zoom small{font-size:10px;font-weight:600;margin-top:1px}
.zsep{height:4px}
.zsize{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 2px 3px;margin:0;opacity:.95}
.zsize small{color:var(--sub);margin:0 0 1px}
.zsize select{width:100%;padding:2px 0;text-align:center;font-weight:700;border:0;background:var(--bg)}
/* 確認ダイアログ */
.sheet.cfm{z-index:50;align-items:center}
.cfm .sheet-in{border-radius:14px;margin:16px;max-width:400px}
#cfmMsg{font-size:16px;font-weight:700;margin:4px 0 14px;line-height:1.6}
#cfmOk.danger{background:var(--red);color:#fff;border-color:var(--red)}
.fbox{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 82px);max-height:45%;overflow:auto;z-index:2;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px;padding:4px 8px;font-size:12px;line-height:1.55;box-shadow:0 1px 4px rgba(0,0,0,.15)}

<script>
const SIZES=["15","20","25","32","40","50","65","80"];
const MODES={
  weld:{
    lead:"芯寸法から継手の芯先寸法（フランジは控え寸法）を引いて、管の切断長を出します。",
    setTitle:"継手寸法・ギャップの設定（溶接）",
    fits:{LR:"エルボ ノーマル",SR:"エルボ ショート",T:"チーズ",F:"フランジ(SOP)"},
    cols:{LR:"エルボ ノーマル",SR:"エルボ ショート",T:"チーズ",F:"フランジ控え",R:"レジューサ長"},
    def:{
      LR:{"15":38.1,"20":38.1,"25":38.1,"32":47.6,"40":57.2,"50":76.2,"65":95.3,"80":114.3},
      SR:{"15":null,"20":null,"25":25.4,"32":31.8,"40":38.1,"50":50.8,"65":63.5,"80":76.2},
      T: {"15":25.4,"20":28.6,"25":38.1,"32":47.6,"40":57.2,"50":63.5,"65":76.2,"80":85.7},
      F: {"15":5,"20":5,"25":5,"32":6,"40":6,"50":6,"65":7,"80":7},
      R: {"15":null,"20":38.1,"25":50.8,"32":50.8,"40":63.5,"50":76.2,"65":88.9,"80":88.9}
    },
    note:"エルボ・チーズの初期値は JIS B 2311 鋼製突合せ溶接式継手の芯先寸法（mm）。15A・20A のショートエルボは規格外のため空欄です。フランジ(SOP)は面からの控え寸法で、初期値は目安です。社内基準や施工要領の値に合わせてください。フランジにはギャップを引きません。レジューサ長（同心レジューサ JIS B 2311、大径側の口径の行）はアイソメ図モードで使います。入力した値はこのブラウザに保存されます。"
  },
  thread:{
    lead:"芯寸法から継手の引き寸法（芯先寸法 − ねじ込み長さ）を引いて、管の切断長を出します。フランジは面からの控え寸法を引きます。",
    setTitle:"継手寸法の設定（ねじ込み）",
    fits:{L:"エルボ",L45:"45°エルボ",T:"チーズ",F:"ねじ込みフランジ"},
    cols:{L:"エルボ",L45:"45°エルボ",T:"チーズ",F:"フランジ控え",N:"ねじ込み長さ",RS:"径違いソケット長"},
    def:{
      L:  {"15":27,"20":32,"25":38,"32":46,"40":48,"50":57,"65":69,"80":78},
      L45:{"15":21,"20":25,"25":29,"32":34,"40":37,"50":42,"65":49,"80":54},
      T:  {"15":27,"20":32,"25":38,"32":46,"40":48,"50":57,"65":69,"80":78},
      F:  {"15":7,"20":9,"25":10,"32":11,"40":12,"50":13,"65":15,"80":17},
      N:  {"15":11,"20":13,"25":15,"32":17,"40":18,"50":20,"65":23,"80":25},
      RS: {"15":null,"20":null,"25":null,"32":null,"40":null,"50":null,"65":null,"80":null}
    },
    note:"継手の初期値は JIS B 2301 ねじ込み式可鍛鋳鉄製管継手の芯先寸法（mm）、ねじ込み長さは一般的な目安です。締め込み具合で変わるので、現場や社内基準の値に合わせてください。ねじ込みフランジの控え寸法（フランジ面から管端まで）は、25A＝10mm を基準にねじ込み長さの比率で各口径を割り出した値です。径違いソケット長（大径側の口径の行）は、白管アイソメで途中にレジューサを置いたときに使います。お使いの継手の全長を入れてください。入力した値はこのブラウザに保存されます。"
  }
};
const KEY="sgp-cut-calc-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
let S=load();

function blankSeg(prev){
  const first=Object.keys(MODES[S?S.mode:"weld"].fits)[0];
  return {type:"cc",size:prev?prev.size:"25",len:"",a:prev?(prev.type==="cc"?prev.b:prev.a):first,b:first};
}
function load(){return fromSaved(readSaved());}
function readSaved(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function fromSaved(s){
  const n={mode:"weld",gap:0,tbl:{weld:clone(MODES.weld.def),thread:clone(MODES.thread.def)},segs:{weld:null,thread:null},iso:{edges:[],parts:{},opt:{},pieces:{},runs:{},size:"25",view:null,showCut:false}};
  if(s){
    if(s.mode)n.mode=s.mode;
    if(s.gap!==undefined)n.gap=s.gap;
    if(s.pack!==undefined)n.pack=s.pack;
    const oldW=s.tbl&&s.tbl.LR?s.tbl:(s.tbl&&s.tbl.weld);           // 旧版データの引き継ぎ
    if(oldW)for(const k in oldW)n.tbl.weld[k]=oldW[k];
    if(s.tbl&&s.tbl.thread)for(const k in s.tbl.thread)n.tbl.thread[k]=s.tbl.thread[k];
    if(Object.values(n.tbl.thread.F||{}).every(v=>v===null||v===""))n.tbl.thread.F=clone(MODES.thread.def.F); // 未入力なら初期値を入れる
    if(s.iso)Object.assign(n.iso,s.iso);
    if(s.isoT)n.isoT=s.isoT;
    if(!n.iso.runs)n.iso.runs={};
    if(s.lastToken)n.lastToken=s.lastToken;
    if(Array.isArray(s.segs))n.segs.weld=s.segs;
    else if(s.segs){n.segs.weld=s.segs.weld;n.segs.thread=s.segs.thread;}
  }
  const first=m=>Object.keys(MODES[m].fits)[0];
  for(const m of ["weld","thread"])
    if(!n.segs[m]||!n.segs[m].length)n.segs[m]=[{type:"cc",size:"25",len:"",a:first(m),b:first(m)}];
  return n;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const r1=n=>Math.round(n*10)/10;
const segs=()=>S.segs[S.mode];
const isIso=()=>S.mode==="iso"||S.mode==="isoT";
const SYS=()=>S.mode==="isoT"?"thread":"weld"; // アイソメの配管方式
const TM=()=>S.mode==="iso"?"weld":S.mode==="isoT"?"thread":S.mode;
const freshIso=()=>({edges:[],parts:{},opt:{},pieces:{},runs:{},size:"20",view:null,showCut:false});
const num=v=>(v===null||v===""||v===undefined||isNaN(parseFloat(v)))?null:parseFloat(v);

function deduct(f,size){
  const t=S.tbl[S.mode],M=MODES[S.mode];
  const A=num(t[f]&&t[f][size]);
  if(A===null)return {error:`${size}A の${M.fits[f]}の寸法が未設定です。下の設定で入力してください。`};
  if(S.mode==="thread"&&f==="F")return {v:A,txt:String(r1(A))}; // ねじ込みフランジは面からの控え寸法をそのまま引く
  if(S.mode==="thread"){
    const N=num(t.N[size]);
    if(N===null)return {error:`${size}A のねじ込み長さが未設定です。下の設定で入力してください。`};
    return {v:A-N,txt:`(${r1(A)}−${r1(N)})`};
  }
  return {v:A,txt:String(r1(A))};
}

function calc(seg){
  const L=parseFloat(seg.len);
  if(isNaN(L))return {empty:true};
  const fits=seg.type==="cc"?[seg.a,seg.b]:[seg.a];
  const parts=[];
  for(const f of fits){const d=deduct(f,seg.size);if(d.error)return d;parts.push(d);}
  const gap=S.mode==="weld"?(parseFloat(S.gap)||0):0;
  const nG=fits.filter(x=>x!=="F").length; // フランジ(SOP)はギャップなし
  const cut=L-parts.reduce((a,p)=>a+p.v,0)-gap*nG;
  let f=`${r1(L)} − ${parts.map(p=>p.txt).join(" − ")}`;
  if(gap&&nG)f+=` − ${r1(gap)}×${nG}`;
  if(cut<=0)return {error:"配管長が継手寸法より短くなっています。"};
  return {cut:r1(cut),formula:f};
}

function opts(map,sel){return Object.entries(map).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("");}
function dimName(seg){
  const p=x=>x==="F"?"面":"芯";
  if(seg.type==="ce")return seg.a==="F"?"面〜先寸法":"芯先寸法";
  const a=p(seg.a),b=p(seg.b);
  return (a==="芯"&&b==="芯")?"芯々寸法":`${a}〜${b}寸法`;
}

function render(){
  const box=document.getElementById("segs");box.innerHTML="";
  const FIT=MODES[S.mode].fits;
  const sizeMap=Object.fromEntries(SIZES.map(s=>[s,s+"A"]));
  segs().forEach((seg,i)=>{
    if(!FIT[seg.a])seg.a=Object.keys(FIT)[0];
    if(!FIT[seg.b])seg.b=Object.keys(FIT)[0];
    const el=document.createElement("section");el.className="seg";
    el.innerHTML=`
      <div class="seg-head">
        <span class="seg-no">${i+1}</span>
        <div class="toggle" role="group" aria-label="寸法の種類">
          <button data-t="cc" aria-pressed="${seg.type==="cc"}">芯々</button>
          <button data-t="ce" aria-pressed="${seg.type==="ce"}">芯先</button>
        </div>
        ${segs().length>1?`<button class="del" aria-label="この一辺を削除">×</button>`:""}
      </div>
      <div class="grid">
        <div><label>口径</label><select data-k="size">${opts(sizeMap,seg.size)}</select></div>
        <div><label>${dimName(seg)}（mm）</label><input class="kp" data-k="len" type="text" inputmode="none" autocomplete="off" value="${seg.len}" placeholder="0"></div>
        <div class="${seg.type==="cc"?"":"full"}"><label>${seg.type==="cc"?"始点の継手":"継手"}</label><select data-k="a">${opts(FIT,seg.a)}</select></div>
        ${seg.type==="cc"?`<div><label>終点の継手</label><select data-k="b">${opts(FIT,seg.b)}</select></div>`:""}
      </div>
      <div class="result"></div>`;
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{seg.type=b.dataset.t;save();render();});
    const d=el.querySelector(".del");if(d)d.onclick=()=>{segs().splice(i,1);save();render();};
    el.querySelectorAll("[data-k]").forEach(inp=>{
      inp.addEventListener(inp.tagName==="INPUT"?"input":"change",()=>{seg[inp.dataset.k]=inp.value;save();
        if(inp.dataset.k==="a"||inp.dataset.k==="b")render();else update();});
    });
    box.appendChild(el);
  });
  update();
}

function update(){
  if(isIso())return renderIso();
  let sum=0;
  document.querySelectorAll(".seg").forEach((el,i)=>{
    const res=calc(segs()[i]);const out=el.querySelector(".result");
    if(res.empty)out.innerHTML=`<span class="formula">寸法を入れると切断長が出ます</span>`;

/* ===================== アイソメ図モード（SGP黒管・溶接） ===================== */
const GS=40,C3=Math.sqrt(3)/2;
const PK=k=>k.split(",").map(Number);
const KK=(i,j)=>i+","+j;
const ppos=k=>{const [i,j]=PK(k);return {x:i*GS*C3,y:j*GS+i*GS/2};};
const NB=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
const ek=(a,b)=>a<b?a+"|"+b:b+"|"+a;
const PART_NAME={valve:"バルブ",flex:"フレキ",reducer:"レジューサ",flange:"フランジ",fpair:"フランジ"};
const REF={open:"先",flange:"面",pend:"端",elbow:"芯",tee:"芯",valve:"面",flex:"面",fpair:"面",reducer:"中心"};
const CIR="①②③④⑤⑥⑦⑧⑨⑩⑪⑫";
const isPartT=t=>t==="valve"||t==="flex"||t==="fpair"||t==="reducer";
const fx=n=>Math.round(n*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let E=new Set(S.iso.edges),G=null,undoStack=[],isoMode="draw",isoTool="valve",sel=null,LBOX=[];

const packV=()=>{const v=num(S.pack===undefined?"3":S.pack);return v===null?0:v;}; // フランジパッキン厚（共通）

const rdatW=run=>S.iso.runs[run.key]=S.iso.runs[run.key]||{};

  undoStack.push(j);if(undoStack.length>60)undoStack.shift();updUR();return true;}

function nearestPt(w){
  const fi=w.x/(GS*C3);let best=null,bd=1e9;
  for(const i of [Math.floor(fi),Math.ceil(fi)]){
    const fj=(w.y-i*GS/2)/GS;
    for(const j of [Math.floor(fj),Math.ceil(fj)]){const p=ppos(KK(i,j));const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=KK(i,j);}}
  }
  return {k:best,d:bd};
}

/* 経路の解析：曲がり・分岐・部品の位置を節点にし、その間を1本の配管にする。
   継手〜継手のまっすぐな区間（途中に部品を含む）を「直管区間」としてまとめる */
function analyze(){
  const adj=new Map();
  const add=(a,b)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b);};
  for(const e of E){const [a,b]=e.split("|");add(a,b);add(b,a);}
  const dir=(a,b)=>{const p=PK(a),q=PK(b);return [q[0]-p[0],q[1]-p[1]];};
  const col=(k,x,y)=>{const d1=dir(k,x),d2=dir(k,y);return d1[0]===-d2[0]&&d1[1]===-d2[1];};
  const partAt=k=>{const pt=S.iso.parts[k];if(!pt)return null;const n=adj.get(k)||[];
    if(pt.t==="flange")return n.length===1?pt:null;
    if((pt.t==="valve"||pt.t==="flex")&&n.length===1)return pt; // 端部のバルブ・フレキ
    return (n.length===2&&col(k,n[0],n[1]))?pt:null;};
  const isNode=k=>{const n=adj.get(k);if(n.length!==2)return true;if(partAt(k))return true;return !col(k,n[0],n[1]);};
  const nodes=new Map();
  for(const [k,n] of adj){
    if(!isNode(k))continue;
    const pt=partAt(k);let type;
    if(n.length===1)type=pt?(pt.t==="flange"?"flange":"pend"):"open";
    else if(n.length===2)type=pt?pt.t:((S.iso.opt[k]||{}).tee?"tee":"elbow");
    else if(n.length===3)type=[[0,1],[0,2],[1,2]].some(([x,y])=>col(k,n[x],n[y]))?"tee":"err";
    else type="err";
    nodes.set(k,{k,type,nb:n,pieces:[]});
  }
  const pieces=[],used=new Set();
  const walk=(s,f)=>{const pts=[s];let prev=s,cur=f;used.add(ek(s,f));
    while(!nodes.has(cur)){pts.push(cur);const nx=adj.get(cur).find(x=>x!==prev);used.add(ek(cur,nx));prev=cur;cur=nx;}
    pts.push(cur);return pts;};
  const visit=k=>{const nd=nodes.get(k);
    for(const nb of nd.nb){if(used.has(ek(k,nb)))continue;
      const pts=walk(k,nb),b=pts[pts.length-1];
      const p={key:ek(k,b),a:k,b,pts};pieces.push(p);nd.pieces.push(p);nodes.get(b).pieces.push(p);
      visit(b);}};
  for(const e of S.iso.edges){
    if(used.has(e)||!E.has(e))continue;
    const [a,b]=e.split("|");let prev=b,cur=a,g=0;
    while(!nodes.has(cur)&&g++<100000){const nx=adj.get(cur).find(x=>x!==prev);prev=cur;cur=nx;}
    if(nodes.has(cur))visit(cur);
  }
  // 直管区間
  const runs=[],rmap=new Map(),inRun=new Set();
  const other=(p,k)=>p.a===k?p.b:p.a;
  for(const p of pieces){
    if(inRun.has(p))continue;
    let start=p.a,cp=p,g=0;
    while(isPartT(nodes.get(start).type)&&g++<1000){const q=nodes.get(start).pieces.find(x=>x!==cp);if(!q)break;start=other(q,start);cp=q;}
    const list=[],parts=[];let cur=start,pc=cp;g=0;
    while(pc&&g++<1000){list.push(pc);inRun.add(pc);const nx=other(pc,cur);cur=nx;
      if(!isPartT(nodes.get(nx).type))break;
      parts.push(nx);pc=nodes.get(nx).pieces.find(x=>x!==pc);}
    const run={key:ek(start,cur),a:start,b:cur,pieces:list,parts};
    runs.push(run);rmap.set(run.key,run);for(const q of list)q.run=run;
  }
  return {adj,nodes,pieces,runs,rmap};
}

/* 区間の向き（起点）・口径・各配管の長さを割り出す */
function computeRuns(){
  for(const run of G.runs){
    const d=rdat(run),rev=d.from===run.b;
    const o={from:rev?run.b:run.a,to:rev?run.a:run.b,pieces:rev?[...run.pieces].reverse():run.pieces,parts:rev?[...run.parts].reverse():run.parts};
    run.o=o;
    let total=num(d.total);
    if(total===null&&!run.parts.length)total=num((S.iso.pieces[run.pieces[0].key]||{}).len); // 旧データ
    run.total=total;
    let s=d.size||S.iso.size;
    o.pieces.forEach(p=>{const ex=(S.iso.pieces[p.key]||{}).size;if(ex)s=ex;p.sz=s;});
    const pos=o.parts.map(k=>num((d.pos||{})[k]));
    const span=o.parts.map(k=>{const pt=S.iso.parts[k];return pt.t==="reducer"?0:pt.t==="fpair"?packV():num(pt.len);});
    // 直結：部品どうしをパッキンだけ挟んでつなぐ（間に配管なし）。位置は前の部品から自動で決まる
    o.pieces.forEach(p=>{p.direct=!!(S.iso.pieces[p.key]||{}).direct&&canDirect(p.a,p.b);});
    // 端部のバルブ・フレキは全長に含める：起点側なら面間ぶん後ろから、終点側なら面間ぶん手前まで
    const pendLen=e=>G.nodes.get(e).type==="pend"?num(S.iso.parts[e].len):0;
    const sOff=pendLen(o.from),eOff=pendLen(o.to);
    const endOf=i=>i===0?sOff:((pos[i-1]===null||span[i-1]===null)?null:pos[i-1]+span[i-1]);
    for(let i=0;i<o.parts.length;i++)if(o.pieces[i].direct){const e=endOf(i);pos[i]=e===null?null:e+packV();}
    const last=o.pieces.length-1;
    if(o.pieces[last].direct){const e=endOf(o.parts.length);total=(e===null||eOff===null)?null:e+packV()+eOff;run.total=total;run.autoTotal=true;}else run.autoTotal=false;
    run.pos=pos;
    o.pieces.forEach((p,i)=>{
      p.len=null;p.lenErr=null;
      const st=endOf(i);
      const en=i===o.pieces.length-1?((total===null||eOff===null)?null:total-eOff):pos[i];
      if(st===null||en===null)return;
      p.lenSrc={en,st};
      p.len=en-st;if(p.len<=0)p.lenErr="全長と追い出し位置が合いません（部品が重なっています）";
    });
  }
}

function canDirect(k1,k2){const a=S.iso.parts[k1],b=S.iso.parts[k2];
  const ok=x=>x&&(x.t==="valve"||x.t==="flex")&&x.conn!=="screw";return ok(a)&&ok(b);}
/* 配管の端で引く寸法 */
function endDed(k,p,acc){
  const TH=SYS()==="thread",nd=G.nodes.get(k),T=TH?S.tbl.thread:S.tbl.weld,gap=TH?0:(parseFloat(S.gap)||0),sz=psz(p);
  const where=TH?"ねじ込みモードの設定欄":"設定欄";
  const need=(c,s,name)=>{const v=num(T[c]&&T[c][s]);if(v===null)throw `${s}A の${name}が未設定です（${where}で入力）`;return v;};
  const add=(n,v)=>{if(acc&&v)acc.push([n,v]);return v;}; // 計算式の表示用に内訳を記録
  const screwIn=()=>{const v=num(S.tbl.thread.N[sz]);if(v===null)throw `${sz}A のねじ込み長さが未設定です（ねじ込みモードの設定欄）`;return add("ねじ込み",-v);};
  switch(nd.type){
    case "open":return 0;
    case "flange":return add("控え",need("F",sz,"フランジ控え"));
    case "valve":case "flex":case "fpair":case "pend":{
      if(nd.type!=="fpair"&&(S.iso.parts[k].conn||"flange")==="screw")return screwIn(); // ネジ接続：管がねじ込まれる分だけ長くなる
      const f=add("控え",need("F",sz,"フランジ控え"));
      const pk=(nd.type==="fpair"||(nd.type==="pend"&&S.iso.parts[k].noPack))?0:packV(); // バルブ・フレキとの間にパッキンが入る
      return f+add("パッキン",pk);}
    case "elbow":case "tee":{
      const mx=String(Math.max(...nd.pieces.map(q=>+psz(q))));
      if(TH){ // 白管：継手の芯先寸法 − ねじ込み長さ（口径が変わる所は大きい方の継手として扱う）
        const nm=nd.type==="tee"?"チーズ":"エルボ";
        return add(nm+(mx!==sz?`(${mx}A)`:""),need(nd.type==="tee"?"T":"L",mx,nm+"寸法"))+screwIn();}
      const short=nd.type==="elbow"&&(S.iso.opt[k]||{}).short;
      const c=nd.type==="tee"?"T":(short?"SR":"LR"),nm=nd.type==="tee"?"チーズ":(short?"ショートエルボ":"エルボ");
      let v=add(nm+(mx!==sz?`(${mx}A)`:""),need(c,mx,nm+"寸法"));v+=add("ギャップ",gap);
      if(+sz<+mx){v+=add("レジューサ",need("R",mx,"レジューサ長"));v+=add("ギャップ",gap);}
      return v;}
    case "reducer":{
      const o=nd.pieces.find(q=>q!==p),os=o?psz(o):sz;
      if(os===sz)throw "レジューサ前後の口径が同じです（寸法入力で変更後の口径を選んでください）";
      const mx=String(Math.max(+sz,+os));
      if(TH)return add("径違いソケット½",need("RS",mx,"径違いソケット長")/2)+screwIn();
      let v=add("レジューサ½",need("R",mx,"レジューサ長")/2);v+=add("ギャップ",gap);return v;}
    default:throw "この形の分岐には対応していません";
  }
}
function pieceCalc(p){
  if(p.direct)return {ref:"直結",direct:true};
  const ref=(REF[G.nodes.get(p.a).type]||"?")+"〜"+(REF[G.nodes.get(p.b).type]||"?");
  let A,B;
  const da=[],db=[];
  try{A=endDed(p.a,p,da);B=endDed(p.b,p,db);}catch(m){return {ref,error:m};}
  if(p.lenErr)return {ref,error:p.lenErr};
  if(p.len===null)return {ref,empty:true};
  const cut=r1(p.len-A-B);
  if(cut<=0)return {ref,error:"寸法が継手より短いです"};
  return {ref,cut,da,db,formula:`${r1(p.len)} − ${r1(A)} − ${r1(B)}`};
}

/* ---- 描画 ---- */
function buildGrid(){
  const R=40;let d="";const L=GS*R*2.6;
  for(let i=-R;i<=R;i++){const x=fx(i*GS*C3);d+=`M${x} ${-L}V${L}`;}
  for(let j=-2*R;j<=2*R;j++){const a=ppos(KK(-R,j)),b=ppos(KK(R,j));d+=`M${fx(a.x)} ${fx(a.y)}L${fx(b.x)} ${fx(b.y)}`;}
  for(let c=-2*R;c<=2*R;c++){const a=ppos(KK(-R,c+R)),b=ppos(KK(R,c-R));d+=`M${fx(a.x)} ${fx(a.y)}L${fx(b.x)} ${fx(b.y)}`;}
  document.getElementById("grid").innerHTML=`<path d="${d}" class="gridline"/>`;
}
function applyView(){const v=V();world.setAttribute("transform",`translate(${v.x},${v.y}) scale(${v.k})`);}
const ln=(a,b,c)=>`<line x1="${fx(a.x)}" y1="${fx(a.y)}" x2="${fx(b.x)}" y2="${fx(b.y)}" class="${c}"/>`;
const poly=(ps,c)=>`<polygon points="${ps.map(p=>fx(p.x)+","+fx(p.y)).join(" ")}" class="${c}"/>`;
const at=(c,d,u,v)=>({x:c.x+d.x*u-d.y*v,y:c.y+d.y*u+d.x*v}); // d方向にu、直角方向にv
const dot=(c,r,cl)=>`<circle cx="${fx(c.x)}" cy="${fx(c.y)}" r="${r}" class="${cl}"/>`;
// 複数色の文字：parts=[[文字,クラス],...]
const tx=(x,y,parts,anc)=>{let nl=false,h="";

  const solve=(l,bad)=>{
    let fb=null;const F0=l.f,T0=l.t,P0=l.p;
    const tryC=(c,sc)=>{if(bad(labelBox(l,c.t,c.f,c.p)))return null;const h=hits(l,c);const r={...c,sc:sc+h*500};if(!fb||r.sc<fb.sc)fb=r;return h===0?r:null;};
    let r;
    if(l.mir&&(r=tryC({t:T0,f:!F0,p:P0},1000)))return r;                                   // ①
    for(let e=STEP;e<=MAXT;e+=STEP)for(const f of (l.mir?[F0,!F0]:[F0]))for(const sg of [1,-1])
      if((r=tryC({t:T0+sg*e,f,p:P0},2000+e+(f!==F0?2:0))))return r;                          // ②
    if(l.mir)for(let q=STEP;q<=MAXP;q+=STEP)for(const f of [F0,!F0])
      if((r=tryC({t:T0,f,p:P0+q},3000+q+(f!==F0?2:0))))return r;                             // ③
    return fb;
  };
  const apply=(l,r)=>{l.t=r.t;l.f=r.f;l.p=r.p;};
  for(let it=0;it<40;it++){
    let moved=false;
    for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){
      const a=T[i],b=T[j];if(!ov(labelBox(a),labelBox(b)))continue;
      const ra=solve(a,bx=>ov(bx,labelBox(b))),rb=solve(b,bx=>ov(bx,labelBox(a)));
      const pick=ra&&rb?(ra.sc<=rb.sc?[a,ra]:[b,rb]):ra?[a,ra]:rb?[b,rb]:null;
      if(pick){apply(pick[0],pick[1]);moved=true;}
    }
    for(const l of T){const b=labelBox(l);if(!obs.some(o=>ov(b,o)))continue;
      const r=solve(l,bx=>obs.some(o=>ov(bx,o)));if(r){apply(l,r);moved=true;}}
    if(!moved)break;
  }
}

function renderSum(){
  const box=document.getElementById("isoSum");
  if(!S.iso.showCut||!G.pieces.length){box.innerHTML="";return;}
  const tot={},errs=new Set();let miss=0;
  for(const p of G.pieces){const r=pieceCalc(p);if(r.direct)continue;
    if(r.error)errs.add(r.error);else if(r.empty)miss++;
    else{const s=psz(p);tot[s]=tot[s]||{n:0,sum:0};tot[s].n++;tot[s].sum+=r.cut;}}
  let h=`<p class="legend">凡例：口径 / <span class="c-blue">全長</span> / <span class="c-red">カット長</span></p>`;
  const ks=Object.keys(tot).sort((a,b)=>a-b);
  if(ks.length)h+=`<table class="sumtbl"><tr><th>口径</th><th>本数</th><th>カット合計</th></tr>${ks.map(s=>`<tr><td>${s}A</td><td>${tot[s].n}本</td><td>${r1(tot[s].sum)} mm</td></tr>`).join("")}</table>`;
  if(miss)h+=`<p class="err">寸法が足りない配管が ${miss} 本あります（寸法モードでタップして入力）</p>`;
  for(const e of errs)h+=`<p class="err">⚠ ${e}</p>`;
  box.innerHTML=h;
}

document.querySelectorAll("#isoParts button").forEach(b=>b.onclick=()=>{isoTool=b.dataset.pt;setIsoMode("part");});

const ptrs=new Map();let gest=null;
const local=e=>{const r=svg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
const toWorld=p=>({x:(p.x-V().x)/V().k,y:(p.y-V().y)/V().k});
svg.addEventListener("pointerdown",e=>{
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){endStroke();const [a,b]=[...ptrs.values()];
    gest={t:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...V()}};return;}
  if(ptrs.size>2)return;
  if(isoMode==="draw"||isoMode==="erase"){const pu=pushUndo();gest={t:"stroke",cur:nearestPt(toWorld(p)).k,changed:false,sx:p.x,sy:p.y,pu};}
  else gest={t:"tap",sx:p.x,sy:p.y,v0:{...V()},moved:false};
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gest)return;
  const p=local(e);ptrs.set(e.pointerId,p);
  if(gest.t==="pinch"){if(ptrs.size<2)return;const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},k=clamp(gest.v0.k*d/gest.d0,.25,4);
    const wx=(gest.m0.x-gest.v0.x)/gest.v0.k,wy=(gest.m0.y-gest.v0.y)/gest.v0.k;
    S.iso.view={x:m.x-wx*k,y:m.y-wy*k,k};applyView();return;}
  if(gest.t==="stroke"){const n=nearestPt(toWorld(p));if(n.d<GS*0.38&&n.k!==gest.cur)stepTo(n.k);return;}
  if(gest.t==="tap"){const dx=p.x-gest.sx,dy=p.y-gest.sy;
    if(!gest.moved&&Math.hypot(dx,dy)>8)gest.moved=true;
    if(gest.moved){S.iso.view={...gest.v0,x:gest.v0.x+dx,y:gest.v0.y+dy};applyView();}}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(!gest)return;
  if(gest.t==="stroke"){const g=gest;endStroke();
    if(!g.changed&&isoMode==="draw"&&e.type==="pointerup"){const p=local(e);if(Math.hypot(p.x-g.sx,p.y-g.sy)<10)tapEdit(toWorld(p));}}
  else if(gest.t==="tap"){const g=gest;gest=null;if(!g.moved&&e.type==="pointerup")isoTap(toWorld(local(e)));else save();}
  else if(gest.t==="pinch"&&ptrs.size===0){gest=null;save();}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(local(e),Math.exp(-e.deltaY*0.0015));},{passive:false});
function zoomAt(m,f){const v=V(),k=clamp(v.k*f,.25,4),wx=(m.x-v.x)/v.k,wy=(m.y-v.y)/v.k;S.iso.view={x:m.x-wx*k,y:m.y-wy*k,k};applyView();save();}
function endStroke(){
  if(!gest||gest.t!=="stroke")return;
  if(gest.changed){syncEdges();save();renderIso();}else if(gest.pu){undoStack.pop();updUR();}
  gest=null;
}
function stepTo(t){
  const tp=ppos(t);let g=0;
  while(gest.cur!==t&&g++<80){
    const [ci,cj]=PK(gest.cur);let best=null,bd=1e9;
    for(const [di,dj] of NB){const nk=KK(ci+di,cj+dj),q=ppos(nk),d=Math.hypot(q.x-tp.x,q.y-tp.y);if(d<bd){bd=d;best=nk;}}
    const e=ek(gest.cur,best);
    if(isoMode==="draw"){if(!E.has(e)){E.add(e);gest.changed=true;}}
    else if(E.has(e)){E.delete(e);gest.changed=true;}
    gest.cur=best;
  }
  if(gest.changed){syncEdges();renderIso();}
}
function segDist(w,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=l2?((w.x-a.x)*dx+(w.y-a.y)*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(w.x-(a.x+dx*t),w.y-(a.y+dy*t));}
function nearestPiece(w,m){let best=null,bd=m;for(const p of G.pieces){const d=segDist(w,ppos(p.a),ppos(p.b));if(d<bd){bd=d;best=p;}}return best;}
function nearestNode(w,m,f){let best=null,bd=m;for(const n of G.nodes.values()){if(f&&!f(n))continue;const q=ppos(n.k),d=Math.hypot(q.x-w.x,q.y-w.y);if(d<bd){bd=d;best=n;}}return best;}
const TH=()=>24/V().k;

function tapEdit(w){const m=isoMode;isoMode="dim";try{isoTap(w);}finally{isoMode=m;}}
function isoTap(w){
  if(isoMode==="pan")return;
  if(isoMode==="dim"){
    // 寸法の文字をタップしたら、その入力欄を開く
    const pad=6/V().k,hit=LBOX.find(h=>w.x>=h.b.x0-pad&&w.x<=h.b.x1+pad&&w.y>=h.b.y0-pad&&w.y<=h.b.y1+pad);
    if(hit&&G.rmap.get(hit.tg.run))return openIsoEdit(hit.tg.run,hit.tg.f);
    const nd=nearestNode(w,18/V().k,n=>isPartT(n.type)||n.type==="pend");
    if(nd)return openIsoEdit(nd.pieces[0].run.key,(nd.type==="pend"?"len:":"pos:")+nd.k);
    const p=nearestPiece(w,TH());
    if(p)return openIsoEdit(p.run.key,"total");
    return closeKp();
  }
  if(isoMode!=="part")return;
  if(isoTool==="tee"||isoTool==="short"){
    const nd=nearestNode(w,TH(),n=>n.type==="elbow"||(n.type==="tee"&&n.nb.length===2));
    if(!nd)return toast("エルボをタップしてください");
    if(isoTool==="short"&&nd.type!=="elbow")return toast("チーズはショートにできません");
    pushUndo();const o=S.iso.opt[nd.k]=S.iso.opt[nd.k]||{};
    if(isoTool==="tee")o.tee=!o.tee;else o.short=!o.short;
    save();renderIso();return;
  }
  if(isoTool==="flange"){
    const nd=nearestNode(w,TH(),n=>n.nb.length===1);
    if(!nd)return toast("配管の端をタップしてください");
    pushUndo();if(S.iso.parts[nd.k])delete S.iso.parts[nd.k];else S.iso.parts[nd.k]={t:"flange"};
    save();renderIso();return;
  }
  if(isoTool==="del"){
    let best=null,bd=TH();
    for(const k in S.iso.parts){const q=ppos(k),d=Math.hypot(q.x-w.x,q.y-w.y);if(d<bd){bd=d;best=k;}}
    if(best){pushUndo();delete S.iso.parts[best];save();renderIso();return;}
    const nd=nearestNode(w,TH(),n=>S.iso.opt[n.k]&&(S.iso.opt[n.k].tee||S.iso.opt[n.k].short));
    if(nd){pushUndo();delete S.iso.opt[nd.k];save();renderIso();return;}
    return toast("外したい部品をタップしてください");
  }
  if(isoTool==="valve"||isoTool==="flex"){ // 配管の端をタップしたら端部に置く
    const en=nearestNode(w,16/V().k,n=>n.nb.length===1&&n.type!=="pend");
    if(en){pushUndo();S.iso.parts[en.k]={t:isoTool,len:null,conn:SYS()==="thread"?"screw":"flange"};save();renderIso();
      return openIsoEdit(G.nodes.get(en.k).pieces[0].run.key,"len:"+en.k,true);}
  }
  const p=nearestPiece(w,TH());
  if(!p)return toast("配管の上をタップしてください");
  const inner=p.pts.slice(1,-1);
  if(!inner.length)return toast("この配管は短くて置けません。2マス以上で描いてください");
  let best=inner[0],bd=1e9;
  for(const k of inner){const q=ppos(k),d=Math.hypot(q.x-w.x,q.y-w.y);if(d<bd){bd=d;best=k;}}
  pushUndo();S.iso.parts[best]={t:isoTool,len:isoTool==="fpair"?"3":null,conn:SYS()==="thread"?"screw":"flange"};save();renderIso();
  const run=G.nodes.get(best).pieces[0].run;
  openIsoEdit(run.key,((isoTool==="reducer"||isoTool==="fpair")?"pos:":"len:")+best,true);
}

const fbox=document.getElementById("fbox");
function fmtDed(arr){arr=arr||[];if(!arr.length)return "";
  const pos=arr.filter(x=>x[1]>0),neg=arr.filter(x=>x[1]<0);
  if(!pos.length)return neg.map(x=>" ＋ "+x[0]+r1(-x[1])).join(""); // ネジ接続の部品：長く切る分
  const inner=pos.map(x=>x[0]+r1(x[1])).join("＋")+neg.map(x=>" − "+x[0]+r1(-x[1])).join(""); // 例：(エルボ32 − ねじ込み13)
  return " − "+(arr.length>1?"(":"")+inner+(arr.length>1?")":"");}

    if(p.lenSrc&&p.lenSrc.st) // 部品の位置から割り出した長さは、その式も出す

function curRun(){return sel?G.rmap.get(sel.key):null;}
function fieldsOf(run){
  const o=run.o,refA=REF[G.nodes.get(o.from).type],refB=REF[G.nodes.get(o.to).type];
  const fs=[run.autoTotal?{id:"total",label:`配管全長（直結で自動）`,cls:"total",auto:true,get:()=>run.total===null?"":r1(run.total),set:()=>{}}:{id:"total",label:`配管全長（${refA}〜${refB}）`,cls:"total",
    get:()=>{const d=rdat(run);return d.total??(run.total!==null&&!o.parts.length?run.total:"");},
    set:v=>{rdatW(run).total=v;},chip:"run"}];
  for(const e of [o.from,o.to])if(G.nodes.get(e).type==="pend"){const pt=S.iso.parts[e];
    fs.push({id:"len:"+e,label:`${PART_NAME[pt.t]}（端部） 面間`,cls:"len",get:()=>pt.len??"",set:v=>{pt.len=v;},part:e});}
  o.parts.forEach((k,i)=>{
    const pt=S.iso.parts[k],nm=PART_NAME[pt.t]+CIR[i];
    const getPos=()=>((rdat(run).pos)||{})[k]??"",setPos=v=>{const d=rdatW(run);(d.pos=d.pos||{})[k]=v;};
    if(o.pieces[i].direct){
      fs.push({id:"pos:"+k,label:`起点→${nm}（直結で自動）`,cls:"pos",auto:true,get:()=>run.pos[i]===null?"":r1(run.pos[i]),set:()=>{},part:k});
      if(pt.t!=="fpair")fs.push({id:"len:"+k,label:`${nm} 面間`,cls:"len",get:()=>pt.len??"",set:v=>{pt.len=v;},part:k});
    }else if(pt.t==="reducer")fs.push({id:"pos:"+k,label:`起点→${nm}（中心）`,cls:"pos",get:getPos,set:setPos,chip:"red",idx:i,part:k});

/* 端部の切り替え：バルブ・フレキの先の配管を消して端にする／先に配管を2マス足して途中に戻す */
function toggleEnd(k){
  const run=curRun();if(!run)return;
  const nd=G.nodes.get(k),d=rdat(run),o=run.o;
  const keep=(x)=>x===undefined||x===null?undefined:String(r1(x));
  if(nd.type==="pend"){
    const other=run.a===k?run.b:run.a,nb=nd.nb[0],[ki,kj]=PK(k),[bi,bj]=PK(nb),di=ki-bi,dj=kj-bj;
    pushUndo();
    const p1=KK(ki+di,kj+dj),p2=KK(ki+2*di,kj+2*dj);E.add(ek(k,p1));E.add(ek(p1,p2));syncEdges();
    const nd2={size:d.size};
    const spk=num(S.iso.parts[k].len)||0;
    if(d.from!==k){nd2.from=other;nd2.pos=Object.assign({},d.pos||{});const T=num(d.total);if(T!==null)nd2.pos[k]=String(r1(T-spk));}
    else{nd2.from=other;const T=num(d.total);if(T!==null){nd2.pos={[k]:String(r1(T-spk))};
      for(const j of run.parts){const v=num((d.pos||{})[j]),pt=S.iso.parts[j],sp=pt.t==="reducer"?0:pt.t==="fpair"?packV():num(pt.len);
        if(v!==null&&sp!==null)nd2.pos[j]=String(r1(T-v-sp));}}}
    const nk=ek(other,p2);S.iso.runs[nk]=nd2;save();renderIso();
    sel={kind:"run",key:nk,field:"total"};refreshPanel(true);toast("端部を外して、先に配管を足しました。全長を入れ直してください");return;
  }
  const i=o.parts.indexOf(k);if(i<0)return;
  const free=e=>G.nodes.get(e).nb.length===1;
  let cut=null,nk=null,nd2=null;
  const spk=num(S.iso.parts[k].len);
  if(i===o.parts.length-1&&free(o.to)){ // 終点側を切る：全長＝この部品の先の面まで
    cut=o.pieces[i+1];nk=ek(o.from,k);
    const pos=Object.assign({},d.pos||{});delete pos[k];
    nd2={size:d.size,from:o.from,pos,total:(run.pos[i]!==null&&spk!==null)?keep(run.pos[i]+spk):undefined};
  }else if(i===0&&free(o.from)){ // 起点側を切る：この部品が新しい起点
    cut=o.pieces[0];nk=ek(k,o.to);
    const sh=run.pos[0]; // 新しい起点＝この部品の外側の面
    const pos={};for(let j=1;j<o.parts.length;j++){const v=run.pos[j];if(v!==null&&sh!==null)pos[o.parts[j]]=String(r1(v-sh));}
    nd2={size:d.size,from:k,pos,total:(run.total!==null&&sh!==null)?String(r1(run.total-sh)):undefined};
  }else return toast("端部にできるのは、その先が配管の端（ほかにつながっていない）場合です");
  pushUndo();
  for(let j=0;j<cut.pts.length-1;j++)E.delete(ek(cut.pts[j],cut.pts[j+1]));
  for(const q of cut.pts)if(q!==k&&S.iso.parts[q]&&S.iso.parts[q].t==="flange")delete S.iso.parts[q];
  syncEdges();S.iso.runs[nk]=nd2;save();renderIso();
  sel={kind:"run",key:nk,field:"len:"+k};refreshPanel(true);toast("端部にしました（先の配管を消しました）");
}

async function saveFile(filename,data,fallback){
  if(DL){
    try{await DL.save({filename,data});return true;}
    catch(e){if(e&&e.code==="declined")return false;}
  }
  if(!inClaude()){ // 普通のブラウザ：スマホは共有メニュー（LINEなど）、PCはダウンロード
    const type=filename.endsWith(".png")?"image/png":filename.endsWith(".json")?"application/json":filename.endsWith(".svg")?"image/svg+xml":"application/octet-stream";
    const blob=data instanceof Blob?data:new Blob([data],{type});
    try{const file=new File([blob],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return true;}
    }catch(e){if(e&&e.name==="AbortError")return false;}
    try{const a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();

  }
  fallback&&fallback();return false;
}

function buildExportSvg(){
  const prev=S.iso.showCut,prevSel=sel;S.iso.showCut=true;sel=null;renderIso();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of ["pipes","marks","labels"]){const g=document.getElementById(id);if(!g.childNodes.length)continue;
    const b=g.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
  const body=["grid","pipes","marks","labels"].map(id=>`<g>${document.getElementById(id).innerHTML}</g>`).join("");
  // 口径ごとの合計
  const tot={};for(const p of G.pieces){const r=pieceCalc(p);if(r.cut!==undefined){const s=psz(p);tot[s]=tot[s]||{n:0,sum:0};tot[s].n++;tot[s].sum+=r.cut;}}
  const lines=Object.keys(tot).sort((a,b)=>a-b).map(s=>`${s}A　${tot[s].n}本　カット合計 ${r1(tot[s].sum)} mm`);
  S.iso.showCut=prev;sel=prevSel;renderIso();
  if(x0>x1)return null;
  const pad=30,top=60,footH=10+lines.length*16;
  const vx=x0-pad,vy=y0-pad-top,W=Math.max(x1-x0+pad*2,320),H=y1-y0+pad*2+top+footH;
  const lg=`<text x="${fx(vx+16)}" y="${fx(vy+48)}" class="lbl foot">凡例：<tspan class="szb">口径</tspan><tspan class="sep"> / </tspan><tspan class="blue">全長</tspan><tspan class="sep"> / </tspan><tspan class="red">カット長</tspan></text>`;
  let foot="";
  lines.forEach((l,i)=>foot+=`<text x="${fx(vx+16)}" y="${fx(y1+pad+16+i*16)}" class="lbl foot">${esc(l)}</text>`);
  const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${fx(vx)} ${fx(vy)} ${fx(W)} ${fx(H)}" width="${Math.round(W)}" height="${Math.round(H)}"><style>${EXPORT_CSS}</style>`+
    `<rect x="${fx(vx)}" y="${fx(vy)}" width="${fx(W)}" height="${fx(H)}" fill="#fff"/>${body}`+
    `<text x="${fx(vx+16)}" y="${fx(vy+28)}" class="lbl ttl">SGP アイソメ図（${SYS()==="thread"?"白管・ねじ込み":"黒管・溶接"}）　${today().s}</text>${lg}${foot}</svg>`;
  return {svgStr,W,H};
}

    if(state.thread)S.tbl.thread=Object.assign(S.tbl.thread,state.thread);
    if(state.gap!==undefined)S.gap=state.gap;
    if(state.pack!==undefined)S.pack=state.pack;
  }else{S=fromSaved(state);}
  if(!S.iso.runs)S.iso.runs={};
  E=new Set(S.iso.edges);sel=null;save();applyMode();if(isIso())setTimeout(fitView,50);
}

/* 共有リンク：図面データを圧縮してリンクの # 以降に入れる */
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const ub64u=t=>{const s=atob(t.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;};
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==="function"){
    const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    return "z"+b64u(z);}
  return "j"+b64u(raw);
}
async function unpack(t){
  const b=ub64u(t.slice(1));
  const txt=t[0]==="z"?await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text():new TextDecoder().decode(b);
  return JSON.parse(txt);
}

async function checkHash(){
  const t=(location.hash||"").slice(1);
  if(!t||!/^[zj][A-Za-z0-9_-]+$/.test(t)||S.lastToken===t)return;
  try{const o=await unpack(t);if(!o||o.app!=="sgp-iso"||!o.iso)return;
    S.lastToken=t;save();
    if(!await askConfirm("共有された図面を開きますか？（今のアイソメ図は上書きされます）","開く",false))return;
    applyImported(o,true);toast("共有された図面を読み込みました");
  }catch(_){}
}
